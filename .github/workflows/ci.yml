name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    env:
      KOTLIN_VERSION: "2.4.20"
      # SHA-256 of kotlin-compiler-2.4.20.zip, as the GitHub release lists it
      KOTLIN_ZIP_SHA256: "59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.6.1673

      # The Kotlin command-line compiler: only the tests and the examples of this repository use it.
      - name: Install kotlinc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlin-compiler.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_ZIP_SHA256}  $RUNNER_TEMP/kotlin-compiler.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/kotlinc/bin/"*
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Show versions
        run: |
          java -version
          clojure --version
          kotlinc -version

      - name: Tests
        run: bin/test

      - name: Examples
        run: examples/run
